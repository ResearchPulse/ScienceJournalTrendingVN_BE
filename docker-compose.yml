version: '3.8'

services:
  vietnam-backend:
    image: ${BACKEND_IMAGE:-ghcr.io/researchpulse/scientificjournalsystem-vietnam-be:latest}
    container_name: researchpulse_backend_vn
    restart: unless-stopped

    ports:
      - "5000:5000"

    env_file:
      - .env

    # Inside Docker, localhost points to this container. The central SSO API
    # is reachable through the shared network; override when the service name
    # differs between environments.
    environment:
      CENTRAL_SSO_API_URL: ${CENTRAL_SSO_API_URL:-http://localhost:3001}
      CENTRAL_SSO_ISSUER_URL: ${CENTRAL_SSO_ISSUER_URL:-${CENTRAL_SSO_API_URL:-http://localhost:3001}}

    networks:
      - researchpulse_network

networks:
  researchpulse_network:
    external: true
    name: researchpulse_network
