name: CI/CD - Main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scientificjournalsystem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scientificjournalsystem_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scientificjournalsystem_test
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/scientificjournalsystem_test
      JWT_SECRET: "test-dummy-jwt-secret"
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test

  docker:
    name: Build & Push Docker Image
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/researchpulse/scientificjournalsystem-vietnam-be:latest
            ghcr.io/researchpulse/scientificjournalsystem-vietnam-be:${{ github.sha }}
            ghcr.io/phunghao2701/scientificjournalsystem-vietnam-be:latest
            ghcr.io/phunghao2701/scientificjournalsystem-vietnam-be:${{ github.sha }}

  deploy:
    name: Deploy to VPS
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p ~/apps/researchpulse-vn-be
            cd ~/apps/researchpulse-vn-be
            cat > docker-compose.yml << 'EOF'
            version: '3.8'
            services:
              vietnam-backend:
                image: ghcr.io/researchpulse/scientificjournalsystem-vietnam-be:latest
                container_name: researchpulse_backend_vn
                restart: unless-stopped
                ports:
                  - "5000:5000"
                env_file:
                  - .env
                networks:
                  - researchpulse_network
            networks:
              researchpulse_network:
                external: true
                name: researchpulse_network
            EOF
            docker-compose pull || docker compose pull
            docker-compose up -d --force-recreate || docker compose up -d --force-recreate
            docker image prune -f
